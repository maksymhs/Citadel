name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Citadel version
      description: Output of `citadel status`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      description: For example Ubuntu 24.04 arm64, macOS 14, WSL2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or `citadel doctor` output
      description: Remove tokens, setup codes and anything private first.
      render: shell
