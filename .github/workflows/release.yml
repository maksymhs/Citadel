# Creates the GitHub Release (marked Latest) whenever a version tag is pushed.
# The notes are that version's section of CHANGELOG.md (scripts/release-notes.js),
# so generate the changelog before tagging: see "Commits and releases" in AGENTS.md.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          node scripts/release-notes.js "$TAG" > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag --latest
